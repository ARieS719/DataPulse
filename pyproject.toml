[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datapulse"
version = "0.1.0"
description = "DataPulse：自带写入前质量熔断门禁（WAP）的湖仓数据可观测性与质量平台"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
keywords = ["data-quality", "data-observability", "lakehouse", "iceberg", "lineage", "pyspark"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Database :: Data Warehousing",
]

dependencies = [
    "pyspark>=3.4,<4",          # >=3.4 才稳定支持 Iceberg 分支 DDL 与 WAP 写入
    "pyyaml>=6.0",
    # sqlglot 26+ 变更了 FROM 参数键（from→from_）导致血缘解析器失效；
    # 解析器已做双键兼容，但 CI 与本地暂固定实测版本区间，放开上限前需在新版上重跑
    # tests/test_lineage.py 全量验证（scripts/debug_sqlglot.py 可辅助诊断）
    "sqlglot>=25,<26",
    "networkx>=3.1",
    "pydantic>=2.5",
    "pandas>=2.0",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "redis>=5.0",
    "psycopg[binary]>=3.1",
    "streamlit>=1.35",
]

[project.optional-dependencies]
ai = [
    "chromadb>=0.5",
    "openai>=1.30",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "httpx>=0.27",
]
realtime = [
    "confluent-kafka>=2.3",
]
modeling = [
    "dbt-duckdb>=1.8",
]

[project.scripts]
datapulse-gen = "foundation.data_gen.generate:main"

[tool.setuptools]
package-dir = { "" = "core", "foundation" = "foundation" }

[tool.setuptools.packages.find]
where = ["core", "foundation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "core"]
addopts = "-q --cov=dq_engine --cov-report=term-missing"

[tool.coverage.run]
source = ["dq_engine"]
# Spark 集成层由本机端到端联调覆盖，不计入单测覆盖率门禁
omit = ["*/dq_engine/quality_gate.py"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
# E402：入口文件先做 sys.path 引导再导入（core/ 不在 site-packages，属项目刻意设计）
# B008：FastAPI 依赖注入的标准写法（Depends 作参数默认值）
per-file-ignores = { "web/api.py" = ["E402", "B008"], "web/dashboard.py" = ["E402"] }
